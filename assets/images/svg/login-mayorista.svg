<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Fondo Principal -->
  <rect width="800" height="320" rx="18" fill="url(#bgGrad)"/>

  <!-- Círculos decorativos de luz -->
  <circle cx="700" cy="50" r="140" fill="#38bdf8" opacity="0.12"/>
  <circle cx="90" cy="270" r="130" fill="#6366f1" opacity="0.15"/>
  <circle cx="420" cy="160" r="95" fill="#0ea5e9" opacity="0.08"/>

  <!-- Cuadrícula técnica sutil -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
  </g>

  <!-- Tarjeta Izquierda: Estadísticas y Ventas -->
  <g transform="translate(55, 42)">
    <rect width="290" height="236" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="32" cy="32" r="8" fill="#38bdf8"/>
    <rect x="50" y="26" width="110" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="50" y="44" width="70" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>

    <!-- Gráfico de Barras Ascendente -->
    <rect x="34" y="155" width="28" height="48" rx="6" fill="#38bdf8" opacity="0.5"/>
    <rect x="78" y="130" width="28" height="73" rx="6" fill="#38bdf8" opacity="0.7"/>
    <rect x="122" y="105" width="28" height="98" rx="6" fill="#38bdf8" opacity="0.85"/>
    <rect x="166" y="82" width="28" height="121" rx="6" fill="url(#accentCyan)"/>
    <rect x="210" y="58" width="28" height="145" rx="6" fill="url(#accentGreen)"/>

    <!-- Línea de Tendencia -->
    <polyline points="48,142 92,118 136,92 180,70 224,45" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="224" cy="45" r="6" fill="#4ade80"/>
  </g>

  <!-- Tarjeta Derecha: Control de Stock, Código de Barras y Seguridad -->
  <g transform="translate(380, 42)">
    <rect width="365" height="110" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.18"/>
    <!-- Icono Escudo / Acceso -->
    <rect x="22" y="22" width="66" height="66" rx="14" fill="#0ea5e9" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.4"/>
    <path d="M55 36 L71 42 V54 C71 65 64 73 55 77 C46 73 39 65 39 54 V42 Z" fill="url(#accentCyan)"/>
    <polyline points="49,56 54,61 63,50" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="106" y="28" width="170" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
    <rect x="106" y="50" width="220" height="10" rx="5" fill="#cbd5e1" opacity="0.65"/>
    <rect x="106" y="70" width="90" height="18" rx="9" fill="#22c55e" fill-opacity="0.25"/>
    <circle cx="118" cy="79" r="4" fill="#4ade80"/>
    <rect x="128" y="75" width="54" height="8" rx="4" fill="#4ade80"/>
  </g>

  <!-- Tarjeta Inferior Derecha: Facturación POS & Código de Barras -->
  <g transform="translate(380, 168)">
    <rect width="365" height="110" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.18"/>
    <!-- Ilustración Código de Barras -->
    <g transform="translate(26, 26)" fill="#ffffff" opacity="0.85">
      <rect x="0" y="0" width="4" height="58" rx="1"/>
      <rect x="8" y="0" width="8" height="58" rx="1"/>
      <rect x="20" y="0" width="3" height="58" rx="1"/>
      <rect x="27" y="0" width="6" height="58" rx="1"/>
      <rect x="37" y="0" width="10" height="58" rx="1"/>
      <rect x="51" y="0" width="4" height="58" rx="1"/>
      <rect x="59" y="0" width="7" height="58" rx="1"/>
    </g>
    <rect x="112" y="30" width="145" height="13" rx="6" fill="#ffffff" opacity="0.9"/>
    <rect x="112" y="52" width="195" height="10" rx="5" fill="#cbd5e1" opacity="0.6"/>
    <rect x="112" y="72" width="115" height="10" rx="5" fill="#38bdf8" opacity="0.75"/>
    <!-- Badge POS -->
    <rect x="285" y="26" width="58" height="28" rx="8" fill="url(#accentGreen)"/>
    <text x="314" y="45" fill="#0f172a" font-family="Segoe UI, sans-serif" font-weight="800" font-size="13" text-anchor="middle">POS</text>
  </g>
</svg>

